<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanYourTV mobile menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=VT323&amp;family=Fredoka:wght@600&amp;display=swap">
<style>
body{margin:0;background:#050505}
a{color:#CFFFCF}a:hover{color:#ffffff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #FFDC96;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050505; color: #ECECEC; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 5px"><div style="background: #E9E9E9"></div><div style="background: #FFDC96"></div><div style="background: #7FE3E0"></div><div style="background: #8EE08F"></div><div style="background: #D58BE6"></div><div style="background: #FF6B6B"></div><div style="background: #6FA8FF"></div></div>

<header style="flex: none; height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #262626">
<a href="#" style="display: flex; align-items: center; gap: 8px; color: #ECECEC; text-decoration: none"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 3.5l5 6 5-6" stroke="#CFFFCF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="3" y="10" width="26" height="18" rx="5" fill="#CFFFCF"></rect><rect x="7" y="14" width="18" height="10" rx="2.5" fill="#050505"></rect></svg><span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px">CleanYour<span style="color: #CFFFCF">TV</span></span></a>
<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="Close menu" aria-expanded="true" aria-controls="menu" onClick="{{toggle}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ECECEC; border: 0; border-radius: 4px; color: #050505"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
<sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu" onClick="{{toggle}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #3A3A3A; border-radius: 4px; color: #ECECEC"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</sc-if>
</header>

<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<nav id="menu" aria-label="Main" style="flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow: auto">
<form role="search" style="display: flex; flex-direction: column; border: 2px solid #ECECEC; border-radius: 6px; overflow: hidden">
<label for="m-tv" style="padding: 6px 12px; background: #ECECEC; color: #050505; font-weight: 600; font-size: 14px">Does it work on my TV?</label>
<div style="display: flex"><input id="m-tv" type="search" placeholder="Brand or model" style="flex: 1; min-width: 0; height: 50px; padding: 0 12px; background: #050505; border: 0; color: #ECECEC; font: inherit; font-size: 16px"><button type="submit" style="height: 50px; padding: 0 18px; background: #CFFFCF; color: #050505; border: 0; border-left: 2px solid #ECECEC; font-family: 'Space Grotesk', sans-serif; font-weight: 700">Check</button></div>
</form>
<div style="display: flex; flex-direction: column">
<p style="margin: 0 0 4px; font-family: 'VT323', monospace; font-size: 19px; color: #A8A8A8">Channel guide</p>
<ul style="list-style: none; margin: 0; padding: 0; border-top: 2px solid #ECECEC">
<sc-for list="{{links}}" as="l" hint-placeholder-count="8">
<li style="border-bottom: 1px solid #262626"><a href="{{l.href}}" style="display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 54px; color: #ECECEC; text-decoration: none"><span style="font-family: 'VT323', monospace; font-size: 20px; color: #A8A8A8">{{l.ch}}</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">{{l.label}}</span><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#CFFFCF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a></li>
</sc-for>
</ul>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="https://github.com/Gathin23/cleanyourtv" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #ECECEC; color: #050505; border-radius: 6px; font-weight: 600; text-decoration: none">GitHub · 36.5k</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 2px solid #FFDC96; color: #FFDC96; border-radius: 6px; font-weight: 600; text-decoration: none">Buy me a coffee</a>
</div>
</nav>
</sc-if>

<sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">
<section style="padding: 32px 16px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: 'VT323', monospace; font-size: 20px; color: #CFFFCF">CH 00 · Android TV and Google TV</p>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 54px; line-height: 0.92; letter-spacing: -0.045em">Your TV, minus the ads.</h1>
<p style="margin: 0; color: #C4C4C4">No root. Nothing uninstalled. One command undoes it.</p>
<p style="margin: 8px 0 0; font-family: 'VT323', monospace; font-size: 19px; color: #A8A8A8">Tap the menu button to open the channel guide.</p>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    var self = this;
    return {
      isOpen: this.state.open,
      isClosed: !this.state.open,
      toggle: function () { self.setState({ open: !self.state.open }); },
      links: [
        { ch: '01', label: 'Set up', href: 'https://cleanyour.tv/#setup', color: '#8EE08F' },
        { ch: '02', label: 'Privacy guide', href: 'https://cleanyour.tv/privacy', color: '#FFDC96' },
        { ch: '05', label: 'Press', href: 'https://cleanyour.tv/press', color: '#FF8A8A' },
        { ch: '06', label: 'Add-ons', href: 'https://cleanyour.tv/addons', color: '#6FA8FF' },
        { ch: '07', label: 'PR bot', href: 'https://cleanyour.tv/bot', color: '#8EE08F' },
        { ch: '08', label: 'Android app', href: 'https://cleanyour.tv/app/android', color: '#8EE08F' },
        { ch: '09', label: 'TV list', href: 'https://cleanyour.tv/tvs', color: '#CFFFCF' },
        { ch: '10', label: 'FAQ', href: 'https://cleanyour.tv/faq', color: '#D58BE6' }
      ]
    };
  }
}
</script>
</body>
</html>
